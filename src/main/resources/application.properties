# ===================================================================
# AASHWIN MART — Default Application Properties
# ===================================================================
app.name=AASHWIN MART
app.identifier=AashwinMart
app.version=1.0.0
app.env=development

# Database Configuration (H2 File-based persistent storage for runtime)
db.driver=org.h2.Driver
db.url=jdbc:h2:./data/aashwinmart;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE;MODE=LEGACY
db.user=sa
db.password=

# HikariCP Pool Configuration
db.pool.minIdle=2
db.pool.maxSize=10
db.pool.idleTimeout=30000
db.pool.maxLifetime=1800000
db.pool.connectionTimeout=30000

# Security Configuration
session.timeout.minutes=30
bcrypt.log.rounds=12

# AI Chatbot Configuration
ai.chatbot.provider=mock
ai.chatbot.gemini.apiKey=
ai.chatbot.gemini.model=gemini-1.5-flash
ai.chatbot.timeoutMs=5000
ai.chatbot.rateLimitPerMin=10
ai.chatbot.maxInputLength=300
